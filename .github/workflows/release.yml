name: Release

# Publishing a version:
#
#   1. bump the version in shive.plg (<!ENTITY version ...>) - by hand, or run ./build.sh locally
#      if you want a package to test with; the MD5 it computes does NOT need to match this
#      workflow's build (see below), only the version number matters going in
#   2. git commit -am "release 2026.09.24" && git push
#   3. git tag 2026.09.24 && git push origin 2026.09.24
#   4. afterwards: git pull  (this workflow may have pushed an MD5 correction to main)
#
# Users install from the shive.plg on `main`, so that file must end up with the MD5 of the exact
# package this workflow publishes as a release asset. That package is built HERE, on this runner -
# so this runner's own build is authoritative, and nothing else needs to match it.
#
# Earlier versions of this workflow instead required whoever tags a release to have *already*
# committed a shive.plg whose MD5 matches what this workflow would independently rebuild, and
# failed the release otherwise. That assumed identical machines would produce byte-identical
# packages. They don't: this package is xz-compressed, and different liblzma builds (e.g. macOS's
# bundled library vs. whatever ships on this runner's Ubuntu image) can encode the same input
# differently - confirmed here in practice with three different MD5s for three byte-identical
# source trees, from two different machines. Chasing that mismatch was flaky and wasted CI minutes.
# So: this runner builds the package, computes the real MD5, and corrects shive.plg on `main` if
# needed - instead of failing and asking a human to somehow predict a value only this runner can
# actually produce.
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils python3

      - name: Build the package for this tag (this build is authoritative)
        run: ./build.sh "${GITHUB_REF_NAME}"

      - name: Make the shive.plg on main match this release (version + MD5)
        run: |
          md5=$(md5sum "build/shive-${GITHUB_REF_NAME}-noarch-1.txz" | cut -d' ' -f1)
          echo "Version/MD5 this release publishes: ${GITHUB_REF_NAME} / $md5"
          # Work on main in a SEPARATE worktree: this job's own checkout is the tag (detached), and
          # build.sh has just modified shive.plg in it - switching that checkout to main fails with
          # "local changes would be overwritten" whenever main's shive.plg differs from the tag's
          # (e.g. after an earlier auto-correct commit). A worktree never touches this checkout.
          #
          # Unconditional: whichever tag was pushed most recently is what main - and so what
          # Unraid installs from - reflects, without trying to guess whether that's "expected".
          # An earlier version only touched the MD5 and skipped entirely when main's version
          # entity didn't already match the tag ("main has moved on, not touching it") - meant to
          # protect against overwriting newer work with a stale re-tagged version, but in practice
          # it silently did nothing the one time a tag and the committed version genuinely
          # disagreed (a same-day version bump that used a different naming step than what was
          # committed) - exactly the case a human re-tagging to fix a mistake needs this workflow
          # to just follow, not second-guess.
          git fetch --depth=1 origin main
          wt=$(mktemp -d)/main      # unique path: no clash with leftovers on a reused runner
          git worktree add -f "$wt" origin/main
          cd "$wt"
          sed -i \
            -e "s/<!ENTITY version   \"[^\"]*\">/<!ENTITY version   \"${GITHUB_REF_NAME}\">/" \
            -e "s/<!ENTITY pkgMD5    \"[^\"]*\">/<!ENTITY pkgMD5    \"$md5\">/" \
            shive.plg
          if git diff --quiet -- shive.plg; then
            echo "main already matches this release - nothing to correct."
            exit 0
          fi
          git diff -- shive.plg
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "Sync main to release ${GITHUB_REF_NAME} [skip ci]" -- shive.plg
          git push origin HEAD:main

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: build/shive-${{ github.ref_name }}-noarch-1.txz
          body: |
            **Install URL** (Unraid → Plugins → Install Plugin):

            ```
            https://raw.githubusercontent.com/heinrichchristopher/shive/main/shive.plg
            ```

            See the `CHANGES` section in `shive.plg` for what changed in this version.
